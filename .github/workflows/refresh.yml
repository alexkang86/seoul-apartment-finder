name: 실거래가 자동갱신 + 배포

on:
  schedule:
    - cron: "0 20 * * *"      # 매일 05:00 KST (20:00 UTC) — data.go.kr 일일 갱신 이후
  workflow_dispatch: {}        # 수동 실행 버튼

permissions:
  contents: write              # 갱신된 데이터 커밋
  pages: write                 # Pages 배포
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 실거래가 수집(서울+경기, 6개월)
        if: ${{ secrets.MOLIT_SERVICE_KEY != '' }}
        env:
          MOLIT_SERVICE_KEY: ${{ secrets.MOLIT_SERVICE_KEY }}
        run: python scripts/pipeline.py --gg --months 6

      - name: 학교(초·중·고) 매칭
        if: ${{ secrets.MOLIT_SERVICE_KEY != '' }}
        run: python scripts/enrich_schools.py

      - name: NPay 단지번호 굽기(스로틀·캐시 누적)
        if: ${{ secrets.MOLIT_SERVICE_KEY != '' }}
        env:
          RESOLVE_LIMIT: "3000"   # 1회 신규 조회 상한 (며칠에 걸쳐 점진 해소)
          RESOLVE_DELAY: "0.2"
        run: python scripts/resolve_complexno.py || true

      - name: 갱신 데이터 커밋
        if: ${{ secrets.MOLIT_SERVICE_KEY != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/data/apartments.json data/complexno_cache.json
          git commit -m "data: 실거래가/단지번호 자동갱신 [skip ci]" || echo "변경 없음"
          git push || echo "push 생략"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
